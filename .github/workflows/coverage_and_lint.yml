name: trusted-pr-bootstrap

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  trusted_same_repository:
    name: bootstrap/kyil-ci-trusted
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor == 'kyleamielke'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kyil-ci
    timeout-minutes: 5
    steps:
      - name: Admission record
        run: |
          echo "trusted bootstrap guard passed"
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "head: ${{ github.event.pull_request.head.sha }}"
          echo "actor: ${{ github.actor }}"
