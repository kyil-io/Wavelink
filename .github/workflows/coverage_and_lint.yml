name: trusted-pr-bootstrap

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  trusted_same_repository:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - Linux
      - X64
      - kyil-ci
    container:
      image: python:3.13-slim
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip install build pyright ruff

      - name: Lint, typecheck, import and build
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .
          pyright
          python -c "import wavelink; print(wavelink.__version__)"
          python -m build
